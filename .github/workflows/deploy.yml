# Promote releases to main, where Vercel deploys production.
name: Deploy

on:
  pull_request:
    types: [closed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  promote:
    name: Promote dev to main
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.title, 'Version Packages'))
    permissions:
      contents: write
    steps:
      - name: Fast-forward main to dev through GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          dev_sha=$(gh api "repos/$GH_REPO/git/ref/heads/dev" --jq '.object.sha')
          if [[ "$main_sha" != "$dev_sha" ]]; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/heads/main" \
              -f sha="$dev_sha" \
              -F force=false
          fi

      - name: Summary
        run: |
          echo "Main now matches the signed commits on dev." >> "$GITHUB_STEP_SUMMARY"
          echo "Verify the production deployment in Vercel." >> "$GITHUB_STEP_SUMMARY"
