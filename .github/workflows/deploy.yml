# Promote releases to main, where Vercel deploys production.
name: Deploy

on:
  pull_request:
    types: [closed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  promote:
    name: Merge dev to main
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.title, 'Version Packages'))
    permissions:
      contents: write
    steps:
      - name: Merge dev into main through GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$GH_REPO/merges" \
            -f base=main \
            -f head=dev \
            -f commit_message="Merge dev into main"

      - name: Summary
        run: |
          echo "Merged dev into main (or main was already up to date)." >> "$GITHUB_STEP_SUMMARY"
          echo "Verify the production deployment in Vercel." >> "$GITHUB_STEP_SUMMARY"
